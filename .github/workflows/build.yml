name: Build and Push Docker Images

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push API Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend-python
        file: ./backend-python/deployment/docker/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: aira-mcp/api:latest,aira-mcp/api:${{ github.sha }}

    - name: Build and push Worker Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend-python
        file: ./backend-python/deployment/docker/Dockerfile.worker
        push: ${{ github.event_name != 'pull_request' }}
        tags: aira-mcp/worker:latest,aira-mcp/worker:${{ github.sha }}
